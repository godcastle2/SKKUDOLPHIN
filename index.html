  <body>
    <main id="app">
      <canvas id="game" aria-label="돌고래 고리 통과 게임"></canvas>

      <section id="hud" class="hud">
        <div>
          <span>점수</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>연속 통과</span>
          <strong id="combo">0</strong>
        </div>
      </section>

      <div id="toast" class="toast" aria-live="polite"></div>

      <section id="startPanel" class="panel">
        <h1>명륜당 앞바다에<br>돌고래가 산다!</h1>
        <p>화면을 톡톡 눌러 돌고래가 고리를 통과하게 도와주세요.</p>
        <button id="startButton">게임 시작</button>
      </section>

      <section id="gameOverPanel" class="panel hidden">
        <h2>게임 종료</h2>
        <dl>
          <div><dt>총점</dt><dd id="finalScore">0</dd></div>
          <div><dt>최고 점수</dt><dd id="bestScore">0</dd></div>
        </dl>
        <button id="restartButton">다시하기</button>
      </section>
    </main>

    <script type="module" src="./src/game.js?v=20260929-2"></script>
  </body>
